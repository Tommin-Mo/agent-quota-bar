<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --paper: #f4f3ef; --surface: #fff; --ink: #17251e; --muted: #506159;
    --line: #daddd4; --forest: #0b6b5e; --mint: #d6f0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #111917; --surface: #1d2823; --ink: #edf3ee; --muted: #afbeb4; --line: #34413b; }
  }
  * { box-sizing: border-box; }
  body { width: 330px; margin: 0; padding: 12px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink); background: var(--paper); }
  h1 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 10px; padding: 14px; border-radius: 10px; background: var(--forest); color: white; font-size: 18px; }
  #time { font-size: 11px; font-weight: 500; color: var(--mint); font-variant-numeric: tabular-nums; }
  #list { padding: 2px 12px; background: var(--surface); border-radius: 9px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .val { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<h1><span>额度概览</span><span id="time" class="muted"></span></h1>
<div id="list"><p class="muted">正在连接本机服务…</p></div>
<script src="popup.js"></script>
</body>
</html>
