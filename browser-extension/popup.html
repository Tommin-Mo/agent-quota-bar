<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 320px; margin: 0; padding: 12px; font: 12px -apple-system, BlinkMacSystemFont, sans-serif; background: Canvas; color: CanvasText; }
  h1 { font-size: 13px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent); }
  .name { font-weight: 600; }
  .val { color: color-mix(in srgb, CanvasText 65%, transparent); font-variant-numeric: tabular-nums; }
  .muted { color: color-mix(in srgb, CanvasText 55%, transparent); }
  button { width: 100%; margin-top: 8px; padding: 6px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 7px; background: color-mix(in srgb, CanvasText 6%, transparent); color: inherit; cursor: pointer; }
</style>
</head>
<body>
<h1><span>额度概览</span><span id="time" class="muted"></span></h1>
<div id="list"><p class="muted">正在连接本机服务…</p></div>
<button id="open">打开 AgentQuotaBar</button>
<script src="popup.js"></script>
</body>
</html>
